<title>Baghdad Al Hayat — animated logo</title>
<style>
  /* native 1024×369 stage (the page scales it with transform) — transparent */
  html, body { margin: 0; width: 1024px; height: 369px; background: transparent; overflow: hidden; }
  body { display: grid; place-items: center; }
  .lockup {
    --wm-w: 700px;
    --wm-h: calc(var(--wm-w) * 191 / 748);
    --leaf-h: calc(var(--wm-h) * 1.93);
    --leaf-w: calc(var(--leaf-h) * 194 / 368);
    display: flex; align-items: center; justify-content: center;
    gap: calc(var(--wm-w) * .05); direction: ltr;
  }
  .leaf { position: relative; width: var(--leaf-w); height: var(--leaf-h); flex: none; }
  .leaf-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; display: block; transform-origin: 38% 97%; }
  .leaf-fill { fill: #d8226f; }
  .spark { opacity: 0; pointer-events: none; }
  .leaf.bloom .leaf-svg { animation: bloom 1.8s ease-out both; }
  .leaf.sway .leaf-svg  { animation: sway 7s ease-in-out infinite; }
  @keyframes bloom { 0% { filter: drop-shadow(0 0 0 rgba(255,80,150,0)); transform: scale(1); } 35% { filter: drop-shadow(0 6px 22px rgba(255,80,150,.65)); transform: scale(1.03); } 100% { filter: drop-shadow(0 0 0 rgba(255,80,150,0)); transform: scale(1); } }
  @keyframes sway { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(1.4deg); } 70% { transform: rotate(-1deg); } }
  .wordmark { width: var(--wm-w); height: var(--wm-h); overflow: visible; display: block; flex: none; margin-top: calc(var(--wm-h) * .18); }
  .wordmark .fill { fill: #ffffff; }
  .wordmark .fill path { opacity: 0; }
  .wordmark .ink path { fill: none; stroke: #ffd0e3; stroke-width: 1.3; stroke-linejoin: round; opacity: 0; }
  .play .wordmark .fill path { animation: inkFill .7s cubic-bezier(.3,.6,.3,1) var(--f) both; }
  .play .wordmark .ink path { animation: draw .95s cubic-bezier(.55,.1,.35,1) var(--d) both, inkOut .6s ease calc(var(--f) + .55s) forwards; }
  @keyframes draw { 0% { opacity: 1; } 100% { opacity: 1; stroke-dashoffset: 0; } }
  @keyframes inkOut { to { opacity: 0; } }
  @keyframes inkFill { from { opacity: 0; } to { opacity: 1; } }
  .shine-leaf .leaf-shine { animation: leafShine 1.1s cubic-bezier(.45,.05,.35,1) both; }
  .shine-text .wm-shine   { animation: wmShine 1.35s cubic-bezier(.45,.05,.35,1) both; }
  .shine .leaf-shine      { animation: leafShine 1.1s cubic-bezier(.45,.05,.35,1) both; }
  .shine .wm-shine        { animation: wmShine 1.35s cubic-bezier(.45,.05,.35,1) .6s both; }
  @keyframes wmShine   { from { transform: translateX(0); } to { transform: translateX(1150px); } }
  @keyframes leafShine { from { transform: translateX(0); } to { transform: translateX(500px); } }
  .instant *, .instant *::before, .instant *::after { animation-duration: 0s !important; animation-delay: 0s !important; }
  .instant .wordmark .ink path { opacity: 0 !important; }
</style>

<script>
/* pen draws the leaf (stem → outline → veins), the wordmark writes itself,
   then a shine sweeps across every 7s — same sequence as the brand intro */
(function () {
  var root = document.documentElement;
  var leaf = document.getElementById('leaf');
  var spark = document.getElementById('spark');
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raf = 0;
  var inks = document.querySelectorAll('.wordmark .ink path');
  for (var i = 0; i < inks.length; i++) {
    var len = Math.ceil(inks[i].getTotalLength()) + 2;
    inks[i].style.strokeDasharray = len + ' ' + len;
    inks[i].style.strokeDashoffset = len;
  }
  var EASE = {
    io: function (t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
    o:  function (t) { return 1 - Math.pow(1 - t, 3); },
    s:  function (t) { return (1 - Math.cos(Math.PI * t)) / 2; }
  };
  var parts = [].map.call(document.querySelectorAll('.leaf .lp'), function (el) {
    var mask = document.getElementById(el.id.replace('lf', 'lm'));
    var mp = mask.querySelector('path');
    var L = mp.getTotalLength();
    mp.style.strokeDasharray = L + ' ' + (L + 10);
    mp.style.strokeDashoffset = reduced ? 0 : L;
    var sp = spark.cloneNode(false); sp.removeAttribute('id'); spark.parentNode.appendChild(sp);
    return { el: el, mp: mp, L: L, sp: sp, mask: 'url(#' + mask.id + ')', t: +el.dataset.t, d: +el.dataset.d, e: EASE[el.dataset.e] || EASE.o };
  });
  var LEAF_END = parts.reduce(function (m, p) { return Math.max(m, p.t + p.d); }, 0);
  spark.parentNode.removeChild(spark);
  function setLeaf(fn, now) {
    parts.forEach(function (p) {
      var k = fn(p);
      p.mp.style.strokeDashoffset = p.L * (1 - k);
      var a = k > 0 && k < 1 ? Math.min(1, Math.sin(Math.PI * k) * 2.2) : 0;
      p.sp.style.opacity = a;
      if (a > 0) { var pt = p.mp.getPointAtLength(p.L * k); p.sp.setAttribute('cx', pt.x); p.sp.setAttribute('cy', pt.y); p.sp.setAttribute('r', 7 + Math.sin((now || 0) / 90) * 1.5); }
    });
  }
  function finishLeaf() { parts.forEach(function (p) { p.el.removeAttribute('mask'); p.sp.style.opacity = 0; }); }
  function shine(cls) { root.classList.remove('shine', 'shine-text', 'shine-leaf'); void root.offsetWidth; root.classList.add(cls); }
  function start() {
    root.classList.add('play');
    if (reduced) { root.classList.add('instant'); finishLeaf(); return; }
    var t0 = performance.now();
    (function frame(now) {
      var s = Math.max(0, now - t0) / 1000;
      setLeaf(function (p) { return p.e(Math.min(1, Math.max(0, (s - p.t) / p.d))); }, now);
      if (s < LEAF_END + .05) raf = requestAnimationFrame(frame); else finishLeaf();
    })(t0);
    setTimeout(function () { leaf.classList.add('bloom'); shine('shine-leaf'); }, (LEAF_END + .05) * 1000);
    setTimeout(function () { leaf.classList.remove('bloom'); leaf.classList.add('sway'); }, (LEAF_END + 1.9) * 1000);
    setTimeout(function () { shine('shine-text'); }, 3400);
    var loop = function () { shine('shine'); setTimeout(loop, 7000); };
    setTimeout(loop, 10000);
  }
  requestAnimationFrame(start);
})();
</script>
