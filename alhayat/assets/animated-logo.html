<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaf Logo — Exact PNG Pieces Animation (Fixed)</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: transparent;
  }

  body {
    display: grid;
    place-items: center;
    overflow: auto;
    background: transparent;
    padding: 0;
  }

  /* keep the full 1024×369 canvas so nothing gets clipped */
  .stage {
    position: relative;
    width: 1024px;
    height: 369px;
    max-width: 100vw;
    aspect-ratio: 1024 / 369;
    background: transparent;
    overflow: visible;
    transform-origin: top left;
  }

  /* when shown on narrow screens, scale the stage down uniformly */
  @media (max-width: 1024px) {
    .stage {
      width: 100vw;
      height: calc(100vw * 369 / 1024);
    }
  }

  .piece {
    position: absolute;
    overflow: hidden;
    pointer-events: none;
  }

  .piece img {
    width: 100%;
    height: 100%;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    animation-fill-mode: both;
    backface-visibility: hidden;
    filter: brightness(1.32) saturate(1.06);
  }

  /* exact PNG pieces only */
  .stem img {
    clip-path: inset(100% 0 0 0);
    animation: stemReveal 10s linear infinite;
  }
  .vein img {
    clip-path: inset(100% 0 0 0);
    animation: veinReveal 10s linear infinite;
  }
  .l-top img {
    transform-origin: 100% 100%;
    transform: scaleY(0);
    animation: lTopReveal 10s linear infinite;
  }
  .l-low img {
    transform-origin: 100% 100%;
    transform: scaleY(0);
    animation: lLowReveal 10s linear infinite;
  }
  .r-top img {
    transform-origin: 100% 50%;
    transform: scaleX(0);
    animation: rTopReveal 10s linear infinite;
  }
  .r-low img {
    transform-origin: 0% 50%;
    transform: scaleX(0);
    animation: rLowReveal 10s linear infinite;
  }
  .outer img {
    clip-path: polygon(-30% 120%, -20% 120%, 18% -20%, 8% -20%);
    animation: outerReveal 10s linear infinite;
  }

  /* 0s–3s build, 3s–10s hold */
  @keyframes stemReveal {
    0%, 1%   { clip-path: inset(100% 0 0 0); }
    6%       { clip-path: inset(0 0 0 0); }
    100%     { clip-path: inset(0 0 0 0); }
  }
  @keyframes outerReveal {
    0%, 5%   { clip-path: polygon(-30% 120%, -20% 120%, 18% -20%, 8% -20%); }
    18%      { clip-path: polygon(-120% 140%, 160% 140%, 160% -40%, -120% -40%); }
    100%     { clip-path: polygon(-120% 140%, 160% 140%, 160% -40%, -120% -40%); }
  }
  @keyframes veinReveal {
    0%, 16%  { clip-path: inset(100% 0 0 0); }
    25%      { clip-path: inset(0 0 0 0); }
    100%     { clip-path: inset(0 0 0 0); }
  }
  @keyframes lTopReveal {
    0%, 20%  { transform: scaleY(0); }
    25%      { transform: scaleY(1); }
    100%     { transform: scaleY(1); }
  }
  @keyframes lLowReveal {
    0%, 22%  { transform: scaleY(0); }
    27%      { transform: scaleY(1); }
    100%     { transform: scaleY(1); }
  }
  @keyframes rTopReveal {
    0%, 23%  { transform: scaleX(0); }
    28%      { transform: scaleX(1); }
    100%     { transform: scaleX(1); }
  }
  @keyframes rLowReveal {
    0%, 24%  { transform: scaleX(0); }
    30%      { transform: scaleX(1); }
    100%     { transform: scaleX(1); }
  }

  .shine {
    display: none !important;
    position: absolute;
    inset: 0;
    background: linear-gradient(
      104deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0) 44%,
      rgba(255,255,255,.92) 50%,
      rgba(255,255,255,0) 56%,
      rgba(255,255,255,0) 100%
    );
    opacity: 0;
    pointer-events: none;
    animation: shineLoop 10s linear infinite;
  }

  @keyframes shineLoop {
    0%, 34% {
      opacity: 0;
      transform: translateX(-240px) skewX(-14deg);
    }
    39% { opacity: .78; }
    44% {
      opacity: 0;
      transform: translateX(320px) skewX(-14deg);
    }

    44.01%, 53% {
      opacity: 0;
      transform: translateX(-240px) skewX(-14deg);
    }
    58% { opacity: .78; }
    63% {
      opacity: 0;
      transform: translateX(320px) skewX(-14deg);
    }

    63.01%, 72% {
      opacity: 0;
      transform: translateX(-240px) skewX(-14deg);
    }
    77% { opacity: .78; }
    82% {
      opacity: 0;
      transform: translateX(320px) skewX(-14deg);
    }

    82.01%, 89% {
      opacity: 0;
      transform: translateX(-240px) skewX(-14deg);
    }
    94% { opacity: .72; }
    98% {
      opacity: 0;
      transform: translateX(320px) skewX(-14deg);
    }

    100% {
      opacity: 0;
      transform: translateX(-240px) skewX(-14deg);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .piece img, .shine {
      animation: none !important;
      clip-path: inset(0 0 0 0) !important;
      transform: none !important;
      opacity: 0;
    }
  }
</style>
</head>
